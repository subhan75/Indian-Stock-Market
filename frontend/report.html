<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock report | Stock Analyst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar topbar-split">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">SA</span> Stock Analyst</a>
      <form id="search-form" class="mini-search" role="search" autocomplete="off">
        <div class="combo">
          <label class="sr-only" for="q">Research another stock</label>
          <input id="q" type="text" placeholder="Research another stock"
                 role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
                 spellcheck="false" autocapitalize="off" maxlength="80">
          <ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching stocks" hidden></ul>
        </div>
        <p id="hint" class="sr-only" role="status" aria-live="polite"></p>
      </form>
    </header>

    <main id="report" aria-live="polite" aria-busy="true"></main>

    <footer class="site-foot">Research aid, not financial advice.</footer>
  </div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>

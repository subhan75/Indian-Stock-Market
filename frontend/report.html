<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock report | Stock Analyst</title>
  <meta name="theme-color" content="#14141a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stock Analyst">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314141a%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27sans-serif%27 font-size=%2713%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ESA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/report.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="wrap">
    <header class="topbar topbar-split">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">SA</span> Stock Analyst</a>
      <form id="search-form" class="mini-search" role="search" autocomplete="off">
        <div class="combo">
          <label class="sr-only" for="q">Research another stock</label>
          <input id="q" type="text" placeholder="Research another stock"
                 role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
                 spellcheck="false" autocapitalize="off" maxlength="80">
          <ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching stocks" hidden></ul>
        </div>
        <p id="hint" class="sr-only" role="status" aria-live="polite"></p>
      </form>
    </header>
    <nav class="nav" aria-label="Main">
      <a href="/">Search</a>
      <a href="/holdings.html">My stocks</a>
      <a href="/market.html">Market today</a>
    </nav>

    <main id="main" tabindex="-1" aria-busy="true"></main>

    <footer class="site-foot">Research aid, not financial advice.</footer>
  </div>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/report.js"></script>
</body>
</html>

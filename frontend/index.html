<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Analyst: research a stock</title>
  <meta name="description" content="Plain-words reports on NSE stocks, with every fact linked to its source.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314141a%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27sans-serif%27 font-size=%2713%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3ESA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">SA</span> Stock Analyst</a>
    </header>
    <nav class="nav" aria-label="Main">
      <a href="/">Search</a>
      <a href="/holdings.html">My stocks</a>
      <a href="/market.html">Market today</a>
    </nav>

    <main>
      <section class="hero">
        <h1>Research a stock</h1>
        <p>Get a plain-words report: five health questions, the latest news and the numbers behind them, with every fact linked to its source.</p>

        <form id="search-form" role="search" autocomplete="off">
          <div class="search-row">
            <div class="combo">
              <label class="sr-only" for="q">NSE symbol or company name</label>
              <input id="q" type="text" placeholder="NSE symbol or company name, e.g. ABB"
                     role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
                     spellcheck="false" autocapitalize="off" maxlength="80">
              <ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching stocks" hidden></ul>
            </div>
            <button class="btn" type="submit">Research</button>
          </div>
          <p id="hint" class="hint" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="recent" aria-labelledby="recent-title">
        <div class="recent-head">
          <h2 id="recent-title">Stocks you looked at</h2>
          <span>Newest first</span>
        </div>
        <ul id="recent-list" class="recent-list"></ul>
      </section>
    </main>

    <footer class="site-foot">Research aid, not financial advice.</footer>
  </div>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/search.js"></script>
</body>
</html>
